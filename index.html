<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081713">
  <meta name="description"
    content="Самое волшебное ещё впереди. Дни, часы, минуты и секунды до Нового года — в вашем часовом поясе.">
  <title>До Нового года</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23081713'/%3E%3Cpath d='M32 10 37 27 54 32 37 37 32 54 27 37 10 32 27 27Z' fill='%23d9c49b'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #081713;
      --text: #f1f0e9;
      --gold: #d9c49b;
      --muted: #9aa69c;
      font-family: Arial, Helvetica, sans-serif;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased
    }

    * {
      box-sizing: border-box
    }

    html {
      min-width: 280px;
      min-height: 100%;
      background: var(--bg)
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background: radial-gradient(ellipse at 50% 45%, #133329 0%, #0b201a 37%, var(--bg) 74%);
      color: var(--text)
    }

    ::selection {
      background: #d9c49b;
      color: #081713
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none
    }

    .atmosphere::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.65' filter='url(%23n)'/%3E%3C/svg%3E")
    }

    .halo {
      position: absolute;
      left: 50%;
      top: 40%;
      width: min(70vw, 800px);
      height: min(70vw, 800px);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, #b9ba8520, transparent 65%);
      filter: blur(40px)
    }

    .page {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
      padding: 36px 52px 29px
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 20px
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 3px;
      font-weight: 600;
      white-space: nowrap
    }

    .edition {
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--muted)
    }

    .star {
      position: relative;
      display: inline-block;
      flex-shrink: 0;
      background: var(--gold);
      clip-path: polygon(50% 0, 60% 39%, 100% 50%, 60% 61%, 50% 100%, 40% 61%, 0 50%, 40% 39%)
    }

    .star-small {
      width: 18px;
      height: 18px
    }

    main {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 48px 0 58px
    }

    .countdown {
      width: 100%;
      max-width: 860px;
      text-align: center
    }

    .heading-group {
      position: relative
    }

    .star-hero {
      width: 30px;
      height: 30px;
      margin-bottom: 27px;
      filter: drop-shadow(0 0 15px #d9c49b77)
    }

    h1 {
      margin: 0;
      color: #d7dcd3;
      font-size: clamp(17px, 2vw, 22px);
      font-weight: 400;
      letter-spacing: .02em
    }

    .year {
      width: 100%;
      margin: 9px 0 28px;
      padding-right: .055em;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(125px, 18vw, 218px);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -.065em;
      color: var(--gold);
      text-shadow: 0 0 75px #cfbb8711
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 0 28px;
      border-top: 1px solid #cfdbbd26;
      border-bottom: 1px solid #cfdbbd26
    }

    .unit {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      min-width: 0
    }

    .unit+.unit::before {
      content: "";
      position: absolute;
      left: 0;
      top: 12%;
      height: 60%;
      width: 1px;
      background: linear-gradient(transparent, #cfdbbd22, transparent)
    }

    .number {
      display: block;
      font-size: clamp(32px, 8.7vw, 86px);
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      line-height: 1.03;
      letter-spacing: -.045em;
      padding-right: .045em
    }

    .seconds .number {
      color: var(--gold)
    }

    .label {
      font-size: 10px;
      color: #a5b0a7;
      letter-spacing: 2.5px;
      text-transform: uppercase
    }

    .wish {
      margin: 31px 0 0;
      color: #a6b1a5;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 16px;
      font-style: italic;
      line-height: 1.5;
      letter-spacing: .025em
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      color: #98a59b
    }

    .footer p {
      margin: 0;
      font-size: 10px;
      letter-spacing: .7px;
      line-height: 1.8;
      text-align: center
    }

    .footer-line {
      width: 32px;
      height: 1px;
      background: #b5c5ae30
    }

    .dot {
      padding: 0 8px;
      color: var(--gold)
    }

    .snow {
      position: absolute;
      inset: 0
    }

    .snow i {
      position: absolute;
      left: var(--x);
      top: -12px;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: #e3dfc9;
      opacity: 0;
      animation: drift var(--duration) linear var(--delay) infinite
    }

    @keyframes drift {
      0% {
        opacity: 0;
        transform: translate3d(0, -12px, 0)
      }

      12% {
        opacity: var(--opacity)
      }

      85% {
        opacity: var(--opacity)
      }

      100% {
        opacity: 0;
        transform: translate3d(var(--sway), 105vh, 0)
      }
    }

    .no-script {
      color: var(--gold);
      font-size: 13px
    }

    body.celebrating .year {
      text-shadow: 0 0 65px #d9c49b44
    }

    @media(min-width:1600px) {
      .page {
        padding: 44px 64px 36px
      }

      .countdown {
        max-width: 940px
      }

      .year {
        font-size: 240px;
        margin-bottom: 40px
      }

      .timer {
        max-width: 860px
      }

      .number {
        font-size: 96px
      }
    }

    @media(max-width:600px) {
      .page {
        padding: 25px 23px 22px
      }

      .edition {
        display: none
      }

      .wordmark {
        font-size: 9px;
        letter-spacing: 2.5px;
        gap: 9px
      }

      main {
        padding: 54px 0 50px
      }

      .star-hero {
        width: 25px;
        height: 25px;
        margin-bottom: 24px
      }

      .year {
        margin: 14px 0 33px;
        font-size: clamp(116px, 34vw, 180px)
      }

      .timer {
        padding: 26px 0 24px
      }

      .unit {
        gap: 13px
      }

      .label {
        font-size: 8px;
        letter-spacing: 1.5px
      }

      .wish {
        margin-top: 28px;
        font-size: 14px
      }

      .footer {
        gap: 12px
      }

      .footer-line {
        width: 16px
      }

      .footer p {
        font-size: 9px;
        letter-spacing: .2px
      }

      .dot {
        padding: 0 4px
      }
    }

    @media(max-width:340px) {
      .page {
        padding-right: 16px;
        padding-left: 16px
      }

      .footer-line {
        display: none
      }

      .label {
        letter-spacing: 1px
      }
    }

    @media(max-height:650px) and (min-width:601px) {
      .page {
        padding-top: 24px;
        padding-bottom: 20px
      }

      main {
        padding: 24px 0
      }

      .star-hero {
        margin-bottom: 12px;
        width: 22px;
        height: 22px
      }

      .year {
        font-size: 130px;
        margin-bottom: 14px
      }

      .timer {
        padding: 18px 0
      }

      .number {
        font-size: 62px
      }

      .wish {
        margin-top: 20px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .snow i {
        animation: none;
        opacity: .18;
        top: var(--still-y)
      }
    }
  </style>
</head>

<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="halo"></div>
    <div id="snow" class="snow"></div>
  </div>
  <div class="page">
    <header class="header">
      <div class="wordmark"><span class="star star-small" aria-hidden="true"></span><span>НОВЫЙ ГОД</span></div>
      <span class="edition">МАЛЕНЬКОЕ ОЖИДАНИЕ ЧУДА</span>
    </header>
    <main>
      <section class="countdown" aria-labelledby="heading">
        <div class="heading-group">
          <span class="star star-hero" aria-hidden="true"></span>
          <h1 id="heading">До Нового года</h1>
          <div class="year" id="year" aria-label="2027 год">2027</div>
        </div>
        <div class="timer" id="timer" role="timer" aria-live="off" aria-label="Загрузка обратного отсчёта">
          <div class="unit"><span class="number" id="days">—</span><span class="label" id="days-label">дней</span></div>
          <div class="unit"><span class="number" id="hours">—</span><span class="label" id="hours-label">часов</span>
          </div>
          <div class="unit"><span class="number" id="minutes">—</span><span class="label"
              id="minutes-label">минут</span></div>
          <div class="unit seconds"><span class="number" id="seconds">—</span><span class="label"
              id="seconds-label">секунд</span></div>
        </div>
        <p class="wish" id="wish">Самое волшебное ещё впереди.</p>
        <noscript>
          <p class="no-script">Включите JavaScript, чтобы увидеть обратный отсчёт.</p>
        </noscript>
      </section>
    </main>
    <footer class="footer"><span class="footer-line" aria-hidden="true"></span>
      <p>1 января, 00:00 <span class="dot" aria-hidden="true">·</span> <span>ваше местное время</span></p><span
        class="footer-line" aria-hidden="true"></span>
    </footer>
  </div>
  <script>
    'use strict';

    // Calendar midnight is constructed locally so the countdown follows the device's time zone.
    function getCountdown(now) {
      const celebrating = now.getMonth() === 0 && now.getDate() === 1;
      const year = now.getFullYear() + (celebrating ? 0 : 1);
      const target = new Date(year, 0, 1, 0, 0, 0, 0);
      const total = celebrating ? 0 : Math.max(0, Math.ceil((target.getTime() - now.getTime()) / 1000));
      return {
        year, celebrating,
        days: Math.floor(total / 86400),
        hours: Math.floor(total / 3600) % 24,
        minutes: Math.floor(total / 60) % 60,
        seconds: total % 60
      };
    }

    function plural(number, forms) {
      const lastHundred = number % 100;
      if (lastHundred >= 11 && lastHundred <= 14) return forms[2];
      const lastDigit = number % 10;
      return lastDigit === 1 ? forms[0] : lastDigit >= 2 && lastDigit <= 4 ? forms[1] : forms[2];
    }

    if (typeof document !== 'undefined') {
      const names = {
        days: ['день', 'дня', 'дней'], hours: ['час', 'часа', 'часов'],
        minutes: ['минута', 'минуты', 'минут'], seconds: ['секунда', 'секунды', 'секунд']
      };
      const units = Object.keys(names);
      const values = Object.fromEntries(units.map(name => [name, document.getElementById(name)]));
      const labels = Object.fromEntries(units.map(name => [name, document.getElementById(name + '-label')]));
      const year = document.getElementById('year');
      const heading = document.getElementById('heading');
      const wish = document.getElementById('wish');
      const timer = document.getElementById('timer');
      let timeout;

      function update() {
        const state = getCountdown(new Date());
        const yearText = String(state.year);
        if (year.textContent !== yearText) year.textContent = yearText;
        year.setAttribute('aria-label', yearText + ' год');
        const descriptions = [];
        for (const name of units) {
          const value = String(state[name]).padStart(2, '0');
          const label = plural(state[name], names[name]);
          if (values[name].textContent !== value) values[name].textContent = value;
          if (labels[name].textContent !== label) labels[name].textContent = label;
          descriptions.push(state[name] + ' ' + label);
        }
        timer.setAttribute('aria-label', state.celebrating ? 'Новый год наступил!' : 'До Нового года: ' + descriptions.join(', '));
        heading.textContent = state.celebrating ? 'С Новым годом!' : 'До Нового года';
        wish.textContent = state.celebrating ? 'Пусть сбудется то самое желание.' : 'Самое волшебное ещё впереди.';
        document.body.classList.toggle('celebrating', state.celebrating);
        document.title = state.celebrating ? 'С Новым ' + yearText + ' годом!' : 'До Нового ' + yearText + ' года';
      }

      function tick() {
        clearTimeout(timeout);
        update();
        if (!document.hidden) timeout = setTimeout(tick, 1000 - Date.now() % 1000 + 12);
      }
      document.addEventListener('visibilitychange', tick);
      window.addEventListener('pageshow', tick);
      tick();

      const snow = document.getElementById('snow');
      for (let i = 0; i < 27; i++) {
        const flake = document.createElement('i');
        flake.style.cssText = `--x:${(i * 37.17) % 100}%;--size:${i % 4 === 0 ? 2 : 1}px;--duration:${22 + i % 13}s;--delay:-${i * 3.7}s;--sway:${(i % 2 ? -1 : 1) * (15 + i)}px;--opacity:${.12 + (i % 4) * .06};--still-y:${(i * 29.3) % 100}%`;
        snow.appendChild(flake);
      }
    }

  </script>
</body>

</html>
